[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scamshield"
version = "0.1.0"
description = "API B2B de análise de risco documental de boletos"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1", "uvicorn==0.53.0", "httpx==0.28.1",
    "pydantic==2.13.5", "pydantic-settings==2.15.0", "pypdf==6.18.1", "Pillow==12.3.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-cov==6.0.0", "coverage==7.6.12", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scamshield = ["data/config/*.json", "data/demo/*.json", "data/demo/*.pdf", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=scamshield.domain --cov-branch --cov-report=term-missing --cov-fail-under=100"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["scamshield.domain"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
