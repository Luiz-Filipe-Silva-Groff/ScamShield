services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SCAMSHIELD_MODE: ${SCAMSHIELD_MODE:-demo}
      SCAMSHIELD_API_KEYS: ${SCAMSHIELD_API_KEYS:-}
      SCAMSHIELD_GEMINI_API_KEY: ${SCAMSHIELD_GEMINI_API_KEY:-}
      SCAMSHIELD_GEMINI_MODEL: ${SCAMSHIELD_GEMINI_MODEL:-}
      SCAMSHIELD_READER_TIMEOUT: ${SCAMSHIELD_READER_TIMEOUT:-2.8}
      SCAMSHIELD_REGISTRY_TIMEOUT: ${SCAMSHIELD_REGISTRY_TIMEOUT:-1.2}
      SCAMSHIELD_ANALYSIS_TIMEOUT: ${SCAMSHIELD_ANALYSIS_TIMEOUT:-4.5}
      SCAMSHIELD_UPLOAD_TIMEOUT: ${SCAMSHIELD_UPLOAD_TIMEOUT:-15}
      SCAMSHIELD_RATE_LIMIT: ${SCAMSHIELD_RATE_LIMIT:-30}
      SCAMSHIELD_RATE_WINDOW: ${SCAMSHIELD_RATE_WINDOW:-60}
      SCAMSHIELD_MAX_CONCURRENT: ${SCAMSHIELD_MAX_CONCURRENT:-8}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    ulimits:
      core: 0
